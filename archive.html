<script>
  let whatsappNumber = "233509663058";
  let allProjects = [];
  let currentCategory = "All";
  let currentView = "list";

  function getProjectGroup(proj) {
    const cat = (proj.category || '').toLowerCase();
    const tags = (proj.tags || []).map(t => t.toLowerCase());
    
    if (cat.includes('data analysis') || cat.includes('power bi') || cat.includes('python') || tags.includes('data analysis') || tags.includes('power bi') || tags.includes('python')) {
      return 'Data Analysis';
    }
    if (cat.includes('database') || cat.includes('sql') || tags.includes('database') || tags.includes('sql')) {
      return 'Database';
    }
    return 'Web Development';
  }

  // Strict Chrome Enforcement for Samsung Internet Users
  document.addEventListener("DOMContentLoaded", async () => {
    // Hidden Admin Access Gesture (3 clicks on the header logo)
    const logo = document.querySelector("nav .font-headline-lg");
    if (logo) {
      let clickCount = 0;
      let clickTimeout;
      logo.style.cursor = "pointer";
      logo.addEventListener("click", () => {
        clickCount++;
        clearTimeout(clickTimeout);
        if (clickCount === 3) {
          window.location.href = "admin.html";
        }
        clickTimeout = setTimeout(() => {
          clickCount = 0;
        }, 1000);
      });
    }

    // Load Profile Info to update WhatsApp redirects
    const profile = await getProfile();
    if (profile && profile.whatsapp) {
      whatsappNumber = profile.whatsapp.replace(/\+/g, '').replace(/\s/g, '');
    }

    // Fetch and Render Dynamic Projects
    allProjects = await getProjects();
    
    // Sort projects by year descending
    allProjects.sort((a, b) => {
      const yearA = parseInt(a.year) || 0;
      const yearB = parseInt(b.year) || 0;
      return yearB - yearA;
    });

    // Populate filter counts
    updateFilterCounts();

    // Initial render of all projects (excluding small quote/text cards)
    const activeProjects = allProjects.filter(p => p.card_size !== 'small');
    renderProjects(activeProjects);

    const ua = navigator.userAgent;
    const isSamsung = ua.indexOf("SamsungBrowser") > -1;
    if (isSamsung) {
      const overlay = document.createElement("div");
      overlay.className = "fixed inset-0 z-[200] bg-black/90 flex items-center justify-center p-6 text-center";
      overlay.innerHTML = `
        <div class="bg-surface border border-outline-variant max-w-md w-full p-8 rounded shadow-2xl flex flex-col items-center">
          <span class="material-symbols-outlined text-[64px] text-primary mb-4 animate-bounce">chrome_reader_mode</span>
          <h3 class="font-headline-lg text-headline-lg mb-4 text-on-surface">Please Open in Google Chrome</h3>
          <p class="font-body-md text-body-md text-on-surface-variant mb-6 leading-relaxed">
            It looks like you are browsing using <strong>Samsung Internet</strong>. For the best visual experience, premium animations, and interactive elements, please copy this link and open it in <strong>Google Chrome</strong>.
          </p>
          <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard!');" class="bg-primary text-on-primary px-6 py-3 font-button text-button hover:opacity-90 transition-all flex items-center gap-2 mb-4 w-full justify-center">
            <span class="material-symbols-outlined text-[18px]">content_copy</span> Copy Link
          </button>
          <p class="font-label-mono text-[10px] text-outline uppercase">Optimized for Google Chrome &amp; Safari</p>
        </div>
      `;
      document.body.appendChild(overlay);
    }
  });

  function updateFilterCounts() {
    const activeProjects = allProjects.filter(p => p.card_size !== 'small');
    const total = activeProjects.length;
    const dataAnalysis = activeProjects.filter(p => getProjectGroup(p) === 'Data Analysis').length;
    const webDev = activeProjects.filter(p => getProjectGroup(p) === 'Web Development').length;
    const db = activeProjects.filter(p => getProjectGroup(p) === 'Database').length;

    const countAll = document.getElementById('filter-count-All');
    if (countAll) countAll.textContent = `(${total})`;
    const countData = document.getElementById('filter-count-Data-Analysis');
    if (countData) countData.textContent = `(${dataAnalysis})`;
    const countWeb = document.getElementById('filter-count-Web-Development');
    if (countWeb) countWeb.textContent = `(${webDev})`;
    const countDb = document.getElementById('filter-count-Database');
    if (countDb) countDb.textContent = `(${db})`;
  }

  function setView(view) {
    currentView = view;
    
    // Toggle active styles on the buttons
    const btnList = document.getElementById('view-btn-list');
    const btnGrid = document.getElementById('view-btn-grid');
    if (btnList && btnGrid) {
      if (view === 'list') {
        btnList.className = "font-label-mono text-label-mono text-primary font-bold";
        btnGrid.className = "font-label-mono text-label-mono text-on-surface-variant hover:text-primary";
      } else {
        btnList.className = "font-label-mono text-label-mono text-on-surface-variant hover:text-primary";
        btnGrid.className = "font-label-mono text-label-mono text-primary font-bold";
      }
    }
    
    // Re-render current category projects
    filterArchive(currentCategory);
  }

  function renderProjects(projectsToRender) {
    const archiveList = document.getElementById('archive-list');
    if (!archiveList) return;

    if (currentView === 'list') {
      // Preserve the table header
      const headerHTML = `
        <div class="grid grid-cols-12 gap-4 py-4 px-2 border-b border-outline font-label-mono text-label-mono text-on-surface-variant uppercase hidden md:grid">
          <div class="col-span-1">Year</div>
          <div class="col-span-5">Project Name</div>
          <div class="col-span-4">Category / System</div>
          <div class="col-span-2 text-right">Details</div>
        </div>
      `;

      const rowsHTML = projectsToRender.map(proj => {
        // Build images/gallery HTML if present
        let galleryHTML = '';
        const imagesArray = proj.images || (proj.image_url ? [proj.image_url] : []);
        if (imagesArray.length > 0) {
          galleryHTML = `
            <div class="w-full aspect-video bg-surface-container overflow-hidden rounded border border-outline-variant relative">
              <div class="w-full h-full flex overflow-x-auto snap-x snap-mandatory hide-scroll" style="scrollbar-width: none; -ms-overflow-style: none;">
                ${imagesArray.map((img, i) => `
                  <img alt="${proj.title} ${i+1}" class="w-full h-full flex-shrink-0 snap-center object-cover grayscale hover:grayscale-0 transition-all duration-500" src="${img}"/>
                `).join('')}
              </div>
            </div>
          `;
        }

        const tagsHTML = (proj.tags || []).map(tag => `
          <span class="px-2 py-0.5 bg-surface-container text-on-surface-variant font-label-mono text-[10px] uppercase">${tag}</span>
        `).join('');

        return `
          <div class="group grid grid-cols-12 gap-4 py-6 px-2 border-b border-outline-variant hover:bg-surface-container-low transition-colors duration-200 cursor-pointer items-center">
            <div class="col-span-2 md:col-span-1 font-label-mono text-label-mono text-on-surface-variant">${proj.year || '—'}</div>
            <div class="col-span-8 md:col-span-5 flex flex-col md:flex-row md:items-center gap-2">
              <span class="font-body-lg text-body-lg text-primary font-medium">${proj.title}</span>
              <span class="md:hidden font-label-mono text-[10px] text-on-surface-variant opacity-60">${proj.category || '—'}</span>
            </div>
            <div class="hidden md:block col-span-4">
              <div class="flex flex-wrap gap-2">
                ${tagsHTML}
              </div>
            </div>
            <div class="col-span-2 text-right">
              <span class="material-symbols-outlined text-outline group-hover:text-primary group-hover:translate-x-1 transition-all">arrow_forward</span>
            </div>
            <div class="col-span-12 mt-4 hidden group-hover:block overflow-hidden">
              <div class="grid grid-cols-12 gap-gutter">
                ${galleryHTML ? `<div class="col-span-12 md:col-span-4">${galleryHTML}</div>` : ''}
                <div class="${galleryHTML ? 'col-span-12 md:col-span-8' : 'col-span-12'} flex flex-col justify-center">
                  <p class="font-body-md text-body-md text-on-surface-variant max-w-xl mb-4">
                    ${proj.description || ''}
                  </p>
                  ${proj.project_url ? `
                    <a href="${proj.project_url}" target="_blank" class="font-button text-button flex w-fit items-center gap-2 group/link border-b border-primary pb-1 hover:opacity-80 transition-opacity text-primary">
                      View Live Site
                      <span class="material-symbols-outlined text-[16px] group-hover/link:-translate-y-0.5 group-hover/link:translate-x-0.5 transition-transform">north_east</span>
                    </a>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      archiveList.innerHTML = headerHTML + rowsHTML;
      archiveList.className = "flex flex-col";
    } else {
      // Grid view
      const cardsHTML = projectsToRender.map(proj => {
        const imagesArray = proj.images || (proj.image_url ? [proj.image_url] : []);
        const firstImage = imagesArray[0] || '';
        const tagsHTML = (proj.tags || []).map(tag => `
          <span class="px-2 py-0.5 bg-surface-container text-on-surface-variant font-label-mono text-[9px] uppercase">${tag}</span>
        `).join('');

        return `
          <div class="group border border-outline-variant bg-surface-container-lowest overflow-hidden transition-all duration-300 bento-card hover:border-outline p-6 rounded flex flex-col justify-between min-h-[350px]">
            <div>
              ${firstImage ? `
                <div class="w-full aspect-[16/10] bg-surface-container overflow-hidden rounded border border-outline-variant/30 mb-4">
                  <img alt="${proj.title}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" src="${firstImage}"/>
                </div>
              ` : ''}
              <div class="flex justify-between items-start gap-2 mb-2">
                <span class="font-label-mono text-[10px] text-on-surface-variant uppercase">${proj.category || 'Project'}</span>
                <span class="font-label-mono text-[10px] text-outline">${proj.year || '—'}</span>
              </div>
              <h3 class="font-headline-lg text-xl text-primary font-semibold mb-2 group-hover:text-primary transition-colors">${proj.title}</h3>
              <p class="font-body-md text-xs text-on-surface-variant line-clamp-3 mb-4 leading-relaxed">${proj.description || ''}</p>
            </div>
            <div class="space-y-4">
              <div class="flex flex-wrap gap-1.5">
                ${tagsHTML}
              </div>
              <div class="flex gap-4 pt-2">
                ${proj.project_url ? `
                  <a href="${proj.project_url}" target="_blank" class="font-button text-[12px] flex items-center gap-1.5 text-primary border-b border-primary/30 hover:border-primary pb-0.5 transition-colors font-medium">
                    Live Site
                    <span class="material-symbols-outlined text-[14px]">north_east</span>
                  </a>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      archiveList.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">${cardsHTML}</div>`;
      archiveList.className = "block";
    }
  }

  function filterArchive(category) {
    currentCategory = category;
    const activeProjects = allProjects.filter(p => p.card_size !== 'small');
    // Render filtered list
    if (category === 'All') {
      renderProjects(activeProjects);
    } else {
      const filtered = activeProjects.filter(p => getProjectGroup(p) === category);
      renderProjects(filtered);
    }

    // Update active filter button styles
    const categories = ['All', 'Data Analysis', 'Web Development', 'Database'];
    categories.forEach(cat => {
      const buttonId = `filter-btn-${cat.replace(/\s+/g, '-')}`;
      const btn = document.getElementById(buttonId);
      if (btn) {
        if (cat === category) {
          btn.className = "font-label-mono text-label-mono text-primary flex items-center gap-2 font-bold";
        } else {
          btn.className = "font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2";
        }
      }
    });
  }

  function toggleInquiryModal(show) {
    const modal = document.getElementById('inquiry-modal');
    if (modal) {
      modal.style.display = show ? 'flex' : 'none';
    }
  }
  
  function handleInquirySubmit(event) {
    event.preventDefault();
    const name = document.getElementById('modal-name').value;
    const phone = document.getElementById('modal-phone').value;
    const message = document.getElementById('modal-message').value;
    
    const formattedText = `Hello Opoku Kelvin, my name is ${name}.\n\nMessage: ${message}\n\nMy phone number is: ${phone}`;
    const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(formattedText)}`;
    
    window.open(whatsappUrl, '_blank');
    toggleInquiryModal(false);
  }

  function toggleMobileMenu(show) {
    const menu = document.getElementById('mobile-menu');
    const drawer = document.getElementById('mobile-menu-drawer');
    if (menu && drawer) {
      if (show) {
        menu.style.display = 'block';
        setTimeout(() => {
          drawer.classList.remove('translate-x-full');
          drawer.classList.add('translate-x-0');
        }, 10);
      } else {
        drawer.classList.remove('translate-x-0');
        drawer.classList.add('translate-x-full');
        setTimeout(() => {
          menu.style.display = 'none';
        }, 300);
      }
    }
  }
</script>
